# nvfetcher source definitions
# See: https://github.com/berberman/nvfetcher
#
# Example entry (GitHub latest release):
#
# [tool-name]
# src.github = "owner/repo"
# fetch.github = "owner/repo"
#
# Example entry (specific branch):
#
# [tool-name]
# src.github = "owner/repo"
# src.branch = "main"
# fetch.github = "owner/repo"
#
# Run `nvfetcher` to regenerate _sources/generated.nix

[googleworkspace-cli]
src.github = "googleworkspace/cli"
src.prefix = "v"
fetch.url = "https://github.com/googleworkspace/cli/releases/download/v$ver/google-workspace-cli-aarch64-apple-darwin.tar.gz"

[salesforce-cli]
# nvfetcher has no npm source; read the `latest` dist-tag from the registry.
src.webpage = "https://registry.npmjs.org/@salesforce/cli/latest"
src.regex = '"version":"(\d+\.\d+\.\d+)"'
fetch.url = "https://registry.npmjs.org/@salesforce/cli/-/cli-$ver.tgz"

[chrome-devtools-mcp]
# Prebuilt, dependency-free bundle from npm (see packages/chrome-devtools-mcp).
src.webpage = "https://registry.npmjs.org/chrome-devtools-mcp/latest"
src.regex = '"version":"(\d+\.\d+\.\d+)"'
fetch.url = "https://registry.npmjs.org/chrome-devtools-mcp/-/chrome-devtools-mcp-$ver.tgz"

[playwright-mcp]
src.github = "microsoft/playwright-mcp"
fetch.github = "microsoft/playwright-mcp"

[rea-agents]
# Published tarball ships prebuilt dist/ and the bundled skill, but no lockfile
# (see packages/rea-agents).
src.webpage = "https://registry.npmjs.org/rea-agents/latest"
src.regex = '"version":"(\d+\.\d+\.\d+)"'
fetch.url = "https://registry.npmjs.org/rea-agents/-/rea-agents-$ver.tgz"
