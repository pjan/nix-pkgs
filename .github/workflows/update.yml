name: Update package sources

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: macos-latest # aarch64-darwin required for googleworkspace-cli
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      # Authenticated GitHub API calls: unauthenticated ones hit the shared runner IP rate limit.
      - name: Run nvfetcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '[keys]\ngithub = "%s"\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/nvchecker-keys.toml"
          nix run nixpkgs#nvfetcher -- -c nvfetcher.toml -k "$RUNNER_TEMP/nvchecker-keys.toml"
          rm -f "$RUNNER_TEMP/nvchecker-keys.toml"

      - name: Update dependency pins
        run: nix shell nixpkgs#nodejs nixpkgs#jq -c ./scripts/update-deps.sh

      # PRs opened with GITHUB_TOKEN don't trigger CI, so build here: no PR unless everything builds.
      - name: Build all packages
        run: nix flake check -L

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update package sources"
          title: "chore: update package sources"
          body: Automated nvfetcher run (dependency pins refreshed, all packages built); merged automatically.
          branch: update/nvfetcher
          delete-branch: true

      # Every package built above, which is the gate CI would apply, so merge right away.
      - name: Merge pull request
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
