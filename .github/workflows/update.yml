name: Update package sources

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: macos-latest # aarch64-darwin required for googleworkspace-cli
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # Authenticated GitHub API calls: unauthenticated ones hit the shared runner IP rate limit.
      - name: Run nvfetcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '[keys]\ngithub = "%s"\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/nvchecker-keys.toml"
          nix run nixpkgs#nvfetcher -- -c nvfetcher.toml -k "$RUNNER_TEMP/nvchecker-keys.toml"
          rm -f "$RUNNER_TEMP/nvchecker-keys.toml"

      - name: Update dependency pins
        run: nix shell nixpkgs#nodejs nixpkgs#jq -c ./scripts/update-deps.sh

      # This is the gate CI would apply: nothing is committed unless every package builds.
      - name: Build all packages
        run: nix flake check -L

      # Commit straight to main: PRs opened with GITHUB_TOKEN get CI runs that wait for approval
      # and expire as failures once merged, and pushes made with GITHUB_TOKEN don't trigger CI.
      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update package sources"
          git push origin HEAD:main
